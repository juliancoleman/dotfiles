[package]
name = "qs-fan-helper"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Fail-safe fan control helper for the QS shell"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
thiserror = "2.0"

[profile.release]
panic = "abort"
